<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uji Kompetensi Manajerial &amp; Sosial Kultural — Level 4</title>
<style>
:root{
  --merah:#ED1C24; --maroon:#9A0501; --tinta:#231F20; --kertas:#FFFBEE;
  --amber:#FEBD26; --jingga:#C45824; --biru:#2892C6; --hijau:#73B24A;
  --garis:#E2DBC4; --redup:#6B6558; --putih:#fff;
  --head:"Franklin Gothic Medium Cond","Arial Narrow","Segoe UI",Helvetica,sans-serif;
  --badan:Calibri,"Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--kertas);color:var(--tinta);font-family:var(--badan);font-size:16.5px;line-height:1.6}
a{color:var(--maroon)}
.wrap{max-width:900px;margin:0 auto;padding:0 20px 80px}

/* ---- kepala ---- */
header.top{background:var(--tinta);color:#fff;padding:22px 0 0}
header.top .wrap{padding-bottom:0}
.judul{font-family:var(--head);font-size:31px;line-height:1.1;letter-spacing:.01em;margin:0 0 4px;font-weight:600}
.subjudul{color:#C9C3B4;font-size:14.5px;margin:0 0 16px;max-width:60ch}
.tabs{display:flex;gap:2px}
.tab{font-family:var(--head);font-size:16px;letter-spacing:.02em;background:#3A3532;color:#D8D2C4;border:0;padding:11px 20px 10px;cursor:pointer;border-radius:6px 6px 0 0}
.tab[aria-selected="true"]{background:var(--kertas);color:var(--tinta)}
.tab:focus-visible{outline:3px solid var(--amber);outline-offset:-3px}

/* ---- panel kendali ---- */
.kendali{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:16px 0 12px;border-bottom:1px solid var(--garis)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13.5px;background:transparent;border:1px solid var(--garis);color:var(--redup);padding:4px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:#fff}
.chip:focus-visible{outline:2px solid var(--merah);outline-offset:1px}
.spacer{flex:1}
.mini{font-size:13.5px;color:var(--redup)}
.tombol{font:inherit;font-size:14px;background:var(--putih);border:1px solid var(--garis);padding:6px 13px;border-radius:6px;cursor:pointer;color:var(--tinta)}
.tombol:hover{border-color:var(--tinta)}
.tombol:focus-visible{outline:2px solid var(--merah);outline-offset:1px}

/* ---- kemajuan ---- */
.bar{height:5px;background:#EFE9D6;border-radius:3px;overflow:hidden;margin:14px 0 4px}
.bar i{display:block;height:100%;background:var(--merah);width:0;transition:width .25s}
.barinfo{display:flex;justify-content:space-between;font-size:13px;color:var(--redup);margin-bottom:18px}

/* ---- kartu soal ---- */
.kartu{background:var(--putih);border:1px solid var(--garis);border-radius:10px;padding:24px 26px 26px}
.kepala-soal{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.nomor{font-family:var(--head);font-size:26px;color:var(--merah);line-height:1}
.label{font-size:12.5px;letter-spacing:.03em;color:var(--redup);border:1px solid var(--garis);padding:2px 9px;border-radius:999px}
.stem{font-size:17px;margin:0 0 20px}
.opsi{display:flex;flex-direction:column;gap:9px}
.op{display:flex;gap:13px;align-items:flex-start;text-align:left;font:inherit;background:var(--putih);border:1px solid var(--garis);border-radius:8px;padding:12px 15px;cursor:pointer;width:100%;transition:border-color .12s,background .12s}
.op:hover:not(:disabled){border-color:var(--tinta);background:#FFFDF6}
.op:disabled{cursor:default}
.op:focus-visible{outline:2px solid var(--merah);outline-offset:1px}
.huruf{font-family:var(--head);font-size:15px;width:24px;height:24px;flex:0 0 24px;border-radius:50%;border:1px solid var(--garis);display:grid;place-items:center;margin-top:1px}
.op.benar{border-color:var(--hijau);background:#F2F9EC}
.op.benar .huruf{background:var(--hijau);border-color:var(--hijau);color:#fff}
.op.salah{border-color:var(--merah);background:#FDF0F0}
.op.salah .huruf{background:var(--merah);border-color:var(--merah);color:#fff}
.op.pudar{opacity:.55}

/* ---- ulasan ---- */
.ulasan{margin-top:22px;border-top:2px solid var(--tinta);padding-top:18px}
.vonis{font-family:var(--head);font-size:20px;margin:0 0 12px}
.vonis.ok{color:#4C7A2B}
.vonis.no{color:var(--maroon)}
.blok{margin:0 0 14px}
.blok h4{font-family:var(--head);font-size:14px;letter-spacing:.04em;color:var(--redup);margin:0 0 4px;font-weight:600}
.blok p{margin:0}
.kunci{background:#FFF6DA;border-left:3px solid var(--amber);padding:10px 14px;border-radius:0 6px 6px 0}
.daftar{list-style:none;margin:0;padding:0}
.daftar li{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--garis);font-size:15.5px}
.daftar li:first-child{border-top:0}
.daftar b{font-family:var(--head);color:var(--merah);flex:0 0 16px}
.daftar li.iskunci b{color:var(--hijau)}

/* ---- navigasi ---- */
.nav{display:flex;gap:10px;align-items:center;margin-top:22px}
.nav .tombol{padding:9px 18px}
.utama{background:var(--merah);border-color:var(--merah);color:#fff;font-family:var(--head);font-size:15px;letter-spacing:.02em}
.utama:hover{background:var(--maroon);border-color:var(--maroon)}

/* ---- gambar figural ---- */
.figbaris{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;background:#FFFDF6;border:1px solid var(--garis);border-radius:8px;padding:16px;margin-bottom:18px}
.fig{width:82px;height:82px;flex:0 0 82px}
.fig svg{width:100%;height:100%;display:block}
.tanya{font-family:var(--head);font-size:34px;color:var(--merah);width:82px;height:82px;display:grid;place-items:center;border:2px dashed var(--merah);border-radius:8px}
.sama{font-family:var(--head);font-size:22px;color:var(--redup);padding:0 2px}
.opsifig{display:flex;flex-wrap:wrap;gap:10px}
.opfig{background:var(--putih);border:1px solid var(--garis);border-radius:8px;padding:10px 10px 6px;cursor:pointer;width:106px;text-align:center}
.opfig:hover:not(:disabled){border-color:var(--tinta)}
.opfig:disabled{cursor:default}
.opfig:focus-visible{outline:2px solid var(--merah);outline-offset:1px}
.opfig .huruf{margin:6px auto 0}
.opfig.benar{border-color:var(--hijau);background:#F2F9EC}
.opfig.salah{border-color:var(--merah);background:#FDF0F0}
.matriks{display:grid;grid-template-columns:repeat(3,82px);gap:8px;justify-content:center;background:#FFFDF6;border:1px solid var(--garis);border-radius:8px;padding:16px;margin-bottom:18px}
.sel{width:82px;height:82px;border:1px solid var(--garis);border-radius:6px;background:var(--putih)}
.sel.kosong{border:2px dashed var(--merah);display:grid;place-items:center;font-family:var(--head);font-size:30px;color:var(--merah)}
svg .goresan{fill:none;stroke:var(--tinta);stroke-width:2.4;stroke-linejoin:round}
svg .isian{fill:var(--merah)}
svg .titik{fill:var(--tinta)}

/* ---- ringkasan ---- */
.ringkas{background:var(--putih);border:1px solid var(--garis);border-radius:10px;padding:24px 26px;margin-top:18px}
.ringkas h3{font-family:var(--head);font-size:22px;margin:0 0 4px}
.skor{font-family:var(--head);font-size:46px;color:var(--merah);line-height:1;margin:10px 0 2px}
table{border-collapse:collapse;width:100%;margin-top:14px;font-size:15px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--garis)}
th{font-family:var(--head);font-weight:600;font-size:13.5px;letter-spacing:.03em;color:var(--redup)}
td.angka,th.angka{text-align:right;white-space:nowrap}
.kosongpesan{padding:40px 0;text-align:center;color:var(--redup)}
@media (max-width:640px){
  .judul{font-size:25px}.kartu{padding:18px 16px 20px}.wrap{padding:0 14px 60px}
  .fig,.tanya,.sel{width:64px;height:64px;flex-basis:64px}.matriks{grid-template-columns:repeat(3,64px)}
  .opfig{width:88px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const NAMA_K = ["","Integritas","Kerja Sama","Komunikasi","Orientasi pada Hasil","Pelayanan Publik","Pengembangan Diri dan Orang Lain","Mengelola Perubahan","Pengambilan Keputusan","Perekat Bangsa"];
const NAMA_T = {series:"Deret gambar",odd:"Mencari yang berbeda",analogy:"Analogi gambar",matrix:"Matriks 3×3"};
const HURUF = ["A","B","C","D","E"];
const BANK_A = [].concat(A1,A2,A3,A4,A5);

/* ================= penggambar SVG ================= */
let uid = 0;
function jalur(s,n,r,R,cx,cy){
  s = s||'p'; r = r||0;
  if(s==='c') return "M"+(cx-R)+","+cy+" a"+R+","+R+" 0 1,0 "+(2*R)+",0 a"+R+","+R+" 0 1,0 "+(-2*R)+",0 Z";
  let pts=[], m, ang, rad;
  if(s==='star'){
    m = n*2;
    for(let i=0;i<m;i++){
      ang = -90 + r + i*360/m; rad = (i%2===0) ? R : R*0.45;
      pts.push([cx+rad*Math.cos(ang*Math.PI/180), cy+rad*Math.sin(ang*Math.PI/180)]);
    }
  } else {
    for(let i=0;i<n;i++){
      ang = -90 + r + i*360/n;
      pts.push([cx+R*Math.cos(ang*Math.PI/180), cy+R*Math.sin(ang*Math.PI/180)]);
    }
  }
  return "M"+pts.map(p=>p[0].toFixed(2)+","+p[1].toFixed(2)).join(" L")+" Z";
}
function bagian(f,R,cx,cy,isi){
  // f: 0 kosong, 1 penuh, 2 separuh kiri
  const id = "k"+(++uid);
  let out = '<clipPath id="'+id+'"><path d="'+isi+'"/></clipPath>';
  if(f===1) out += '<path d="'+isi+'" class="isian"/>';
  if(f===2) out += '<rect x="'+(cx-R-2)+'" y="'+(cy-R-2)+'" width="'+(R+2)+'" height="'+(2*R+4)+'" class="isian" clip-path="url(#'+id+')"/>';
  return {def:out,clip:id};
}
function gambar(f,R,cx,cy){
  if(!f) return "";
  R = R||34; cx = cx===undefined?50:cx; cy = cy===undefined?50:cy;
  const d = jalur(f.s,f.n,f.r,R,cx,cy);
  const b = bagian(f.f||0,R,cx,cy,d);
  let g = "<defs>"+b.def.replace(/<path d="[^"]*" class="isian"\/>/,'')+"</defs>";
  // isian digambar setelah defs
  let isi = "";
  if((f.f||0)===1) isi = '<path d="'+d+'" class="isian" opacity=".85"/>';
  if((f.f||0)===2) isi = '<rect x="'+(cx-R-2)+'" y="'+(cy-R-2)+'" width="'+(R+2)+'" height="'+(2*R+4)+'" class="isian" opacity=".85" clip-path="url(#'+b.clip+')"/>';
  let out = g + isi + '<path d="'+d+'" class="goresan"/>';
  // garis mendatar di dalam
  if(f.l){
    const n=f.l, atas=cy-R*0.72, bawah=cy+R*0.72, jarak=(bawah-atas)/(n+1);
    for(let i=1;i<=n;i++){
      const y=atas+jarak*i;
      out += '<line x1="'+(cx-R)+'" y1="'+y.toFixed(1)+'" x2="'+(cx+R)+'" y2="'+y.toFixed(1)+'" class="goresan" stroke-width="2" clip-path="url(#'+b.clip+')"/>';
    }
  }
  // titik-titik
  if(f.d){
    const n=f.d, rr=(n===1)?0:R*0.48, jr=n>8?2.1:2.9;
    for(let i=0;i<n;i++){
      const a=(-90+i*360/n)*Math.PI/180;
      out += '<circle cx="'+(cx+rr*Math.cos(a)).toFixed(2)+'" cy="'+(cy+rr*Math.sin(a)).toFixed(2)+'" r="'+jr+'" class="titik"/>';
    }
  }
  // panah (0 = ke atas, searah jarum jam)
  if(f.ar!==undefined){
    const a=(f.ar-90)*Math.PI/180, pj=R*0.78;
    const x2=cx+pj*Math.cos(a), y2=cy+pj*Math.sin(a);
    const s1=(f.ar-90+150)*Math.PI/180, s2=(f.ar-90-150)*Math.PI/180, ks=9;
    out += '<line x1="'+cx+'" y1="'+cy+'" x2="'+x2.toFixed(2)+'" y2="'+y2.toFixed(2)+'" class="goresan"/>'
        +  '<path d="M'+x2.toFixed(2)+','+y2.toFixed(2)+' L'+(x2+ks*Math.cos(s1)).toFixed(2)+','+(y2+ks*Math.sin(s1)).toFixed(2)
        +  ' L'+(x2+ks*Math.cos(s2)).toFixed(2)+','+(y2+ks*Math.sin(s2)).toFixed(2)+' Z" fill="var(--tinta)"/>';
  }
  // bentuk di dalam
  if(f.i) out += gambar(f.i,R*0.46,cx,cy);
  return out;
}
function svg(f){ return '<svg viewBox="0 0 100 100" aria-hidden="true">'+gambar(f)+'</svg>'; }

/* ================= keadaan ================= */
const keadaan = {
  A:{urut:[],saring:new Set(),ke:0,jawab:{}},
  B:{urut:[],saring:new Set(),ke:0,jawab:{}},
  bank:"A"
};
const bankData = b => b==="A" ? BANK_A : BANK_B;
function kunciSaring(b,i){ return b==="A" ? bankData(b)[i].c : bankData(b)[i].t; }

function susun(b,acak){
  const st=keadaan[b], semua=bankData(b).map((_,i)=>i);
  st.urut = st.saring.size ? semua.filter(i=>st.saring.has(kunciSaring(b,i))) : semua;
  if(acak) for(let i=st.urut.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[st.urut[i],st.urut[j]]=[st.urut[j],st.urut[i]];}
  st.ke = 0;
}

/* ================= tampilan ================= */
const el = id => document.getElementById(id);

function chipsGambar(){
  const b=keadaan.bank, st=keadaan[b];
  const daftar = b==="A" ? [1,2,3,4,5,6,7,8,9].map(i=>[i,NAMA_K[i]]) : Object.keys(NAMA_T).map(t=>[t,NAMA_T[t]]);
  el("chips").innerHTML = daftar.map(([k,n])=>{
    const jml = bankData(b).filter((_,i)=>kunciSaring(b,i)===k).length;
    return '<button class="chip" data-k="'+k+'" aria-pressed="'+st.saring.has(k)+'">'+n+' <span style="opacity:.6">'+jml+'</span></button>';
  }).join("");
  el("chips").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
    let k=c.dataset.k; if(b==="A") k=+k;
    st.saring.has(k) ? st.saring.delete(k) : st.saring.add(k);
    susun(b,false); chipsGambar(); render();
  });
}

function baris(figs){ return '<div class="figbaris">'+figs.map(f=>'<div class="fig">'+svg(f)+'</div>').join("")+'<div class="tanya">?</div></div>'; }

function badanSoal(b,idx,dijawab){
  const s=bankData(b)[idx];
  let atas="", opsi="";
  if(b==="A"){
    atas = '<p class="stem">'+s.q+'</p>';
    opsi = '<div class="opsi">'+s.o.map((t,i)=>{
      let kls="op"; if(dijawab!==undefined){ if(i===s.a) kls+=" benar"; else if(i===dijawab) kls+=" salah"; else kls+=" pudar"; }
      return '<button class="'+kls+'" data-i="'+i+'"'+(dijawab!==undefined?" disabled":"")+'><span class="huruf">'+HURUF[i]+'</span><span>'+t+'</span></button>';
    }).join("")+'</div>';
  } else {
    if(s.t==="series") atas = baris(s.figs) + '<p class="stem">Lanjutkan deret di atas. Gambar mana yang tepat menggantikan tanda tanya?</p>';
    else if(s.t==="odd"){
      atas = '<div class="figbaris">'+s.figs.map((f,i)=>'<div style="text-align:center"><div class="fig">'+svg(f)+'</div><div class="mini">'+HURUF[i]+'</div></div>').join("")+'</div>'
           + '<p class="stem">Empat gambar memiliki satu kesamaan. Gambar mana yang tidak termasuk kelompok itu?</p>';
    }
    else if(s.t==="analogy"){
      atas = '<div class="figbaris"><div class="fig">'+svg(s.p[0])+'</div><span class="sama">:</span><div class="fig">'+svg(s.p[1])+'</div>'
           + '<span class="sama">&nbsp;seperti&nbsp;</span><div class="fig">'+svg(s.p[2])+'</div><span class="sama">:</span><div class="tanya">?</div></div>'
           + '<p class="stem">Temukan hubungan pada pasangan pertama, lalu terapkan pada gambar ketiga.</p>';
    }
    else {
      atas = '<div class="matriks">'+s.cells.map(c=>c?('<div class="sel">'+svg(c)+'</div>'):'<div class="sel kosong">?</div>').join("")+'</div>'
           + '<p class="stem">Temukan aturan yang berlaku pada baris dan kolom, lalu lengkapi sel yang kosong.</p>';
    }
    const daftarOpsi = s.t==="odd" ? s.figs : s.opts;
    opsi = '<div class="opsifig">'+daftarOpsi.map((f,i)=>{
      let kls="opfig"; if(dijawab!==undefined){ if(i===s.a) kls+=" benar"; else if(i===dijawab) kls+=" salah"; }
      return '<button class="'+kls+'" data-i="'+i+'"'+(dijawab!==undefined?" disabled":"")+'><div class="fig" style="width:100%;height:76px">'+svg(f)+'</div><span class="huruf">'+HURUF[i]+'</span></button>';
    }).join("")+'</div>';
  }
  return atas+opsi;
}

function ulasan(b,idx,dijawab){
  const s=bankData(b)[idx], benar = dijawab===s.a;
  const alasan = b==="A" ? s.x : s.why;
  const teks = b==="A" ? s.w : s.rule;
  const daftar = alasan.map((t,i)=>'<li'+(i===s.a?' class="iskunci"':'')+'><b>'+HURUF[i]+'</b><span>'+t+'</span></li>').join("");
  return '<div class="ulasan">'
    + '<p class="vonis '+(benar?"ok":"no")+'">'+(benar?"Tepat.":"Belum tepat.")+' Jawaban benar: '+HURUF[s.a]+'</p>'
    + '<div class="blok"><h4>Mengapa jawaban itu benar</h4><p>'+teks+'</p></div>'
    + '<div class="blok kunci"><h4>Kata kunci</h4><p>'+s.k+'</p></div>'
    + '<div class="blok"><h4>Telaah setiap pilihan</h4><ul class="daftar">'+daftar+'</ul></div>'
    + '</div>';
}

function ringkasan(b){
  const st=keadaan[b], total=st.urut.length;
  let betul=0; const per={};
  st.urut.forEach(i=>{
    const k=kunciSaring(b,i), s=bankData(b)[i];
    per[k]=per[k]||{n:0,b:0};
    if(st.jawab[i]!==undefined){ per[k].n++; if(st.jawab[i]===s.a){betul++;per[k].b++;} }
  });
  const terjawab=Object.keys(st.jawab).filter(i=>st.urut.includes(+i)).length;
  const nama = b==="A" ? (k=>NAMA_K[k]) : (k=>NAMA_T[k]);
  const rows=Object.keys(per).filter(k=>per[k].n>0).map(k=>{
    const p=per[k]; return '<tr><td>'+nama(b==="A"?+k:k)+'</td><td class="angka">'+p.b+' / '+p.n+'</td><td class="angka">'+Math.round(p.b/p.n*100)+'%</td></tr>';
  }).join("");
  return '<div class="ringkas"><h3>Rangkuman sesi</h3>'
    + '<div class="skor">'+betul+' / '+terjawab+'</div>'
    + '<p class="mini">'+terjawab+' soal dikerjakan dari '+total+' soal yang tersedia pada penyaringan ini.</p>'
    + (rows?'<table><thead><tr><th>Kelompok</th><th class="angka">Benar</th><th class="angka">Ketepatan</th></tr></thead><tbody>'+rows+'</tbody></table>':'')
    + '<div class="nav"><button class="tombol utama" id="kembali">Kembali ke soal pertama</button><button class="tombol" id="ulang2">Mulai ulang</button></div></div>';
}

function render(){
  const b=keadaan.bank, st=keadaan[b], total=st.urut.length;
  if(!total){ el("panggung").innerHTML='<div class="kartu"><p class="kosongpesan">Tidak ada soal pada penyaringan ini. Pilih kelompok lain di atas.</p></div>'; el("posisi").textContent=""; el("nilai").textContent=""; el("isibar").style.width="0"; return; }
  if(st.ke>=total){ el("panggung").innerHTML=ringkasan(b); el("kembali").onclick=()=>{st.ke=0;render();}; el("ulang2").onclick=mulaiUlang; el("isibar").style.width="100%"; return; }

  const idx=st.urut[st.ke], s=bankData(b)[idx], dijawab=st.jawab[idx];
  const tag = b==="A" ? NAMA_K[s.c] : NAMA_T[s.t];
  el("panggung").innerHTML = '<div class="kartu">'
    + '<div class="kepala-soal"><span class="nomor">'+String(st.ke+1).padStart(2,"0")+'</span><span class="label">'+tag+'</span></div>'
    + badanSoal(b,idx,dijawab)
    + (dijawab!==undefined ? ulasan(b,idx,dijawab) : "")
    + '<div class="nav">'
      + '<button class="tombol" id="mundur"'+(st.ke===0?" disabled":"")+'>Sebelumnya</button>'
      + (dijawab!==undefined ? '<button class="tombol utama" id="maju">'+(st.ke===total-1?"Lihat rangkuman":"Soal berikutnya")+'</button>' : '<span class="mini">Pilih satu jawaban untuk melihat ulasannya.</span>')
    + '</div></div>';

  el("panggung").querySelectorAll("[data-i]").forEach(tb=>tb.onclick=()=>{ st.jawab[idx]=+tb.dataset.i; render(); });
  const mundur=el("mundur"); if(mundur) mundur.onclick=()=>{ if(st.ke>0){st.ke--;render();} };
  const maju=el("maju"); if(maju) maju.onclick=()=>{ st.ke++; render(); window.scrollTo({top:0,behavior:"smooth"}); };

  const jml=Object.keys(st.jawab).filter(i=>st.urut.includes(+i)).length;
  const betul=Object.keys(st.jawab).filter(i=>st.urut.includes(+i)&&st.jawab[i]===bankData(b)[i].a).length;
  el("posisi").textContent="Soal "+(st.ke+1)+" dari "+total;
  el("nilai").textContent = jml? ("Benar "+betul+" dari "+jml+" · "+Math.round(betul/jml*100)+"%") : "Belum ada jawaban";
  el("isibar").style.width = (st.ke/total*100)+"%";
}

function mulaiUlang(){ const b=keadaan.bank; keadaan[b].jawab={}; susun(b,false); render(); }

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected", x===t ? "true":"false"));
  keadaan.bank=t.dataset.bank; chipsGambar(); render(); window.scrollTo({top:0});
});
el("acak").onclick=()=>{ susun(keadaan.bank,true); keadaan[keadaan.bank].jawab={}; render(); };
el("ulang").onclick=mulaiUlang;

document.addEventListener("keydown",e=>{
  const b=keadaan.bank, st=keadaan[b];
  if(st.ke>=st.urut.length) return;
  const idx=st.urut[st.ke];
  if(e.key==="ArrowRight" && st.jawab[idx]!==undefined){ st.ke++; render(); }
  else if(e.key==="ArrowLeft" && st.ke>0){ st.ke--; render(); }
  else if(st.jawab[idx]===undefined){
    const p="abcde".indexOf(e.key.toLowerCase()), n=parseInt(e.key,10)-1;
    const pilih = p>=0?p:(n>=0?n:-1);
    const tombol=el("panggung").querySelector('[data-i="'+pilih+'"]');
    if(pilih>=0 && tombol){ st.jawab[idx]=pilih; render(); }
  }
});

susun("A",false); susun("B",false); chipsGambar(); render();
el("cap").textContent = "Build 5 · " + BANK_A.length + " soal kompetensi · " + BANK_B.length + " soal figural";
</script>
</body>
</html>
