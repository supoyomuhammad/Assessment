"Menerima pelemahan tersebut sebagai konsekuensi wajar dari pergantian pejabat"],
a:1,k:"Perubahan bertahan ketika melekat pada prosedur dan ukuran kinerja, bukan pada orang.",
w:"Indikator 4.2 menuntut memastikan perubahan diterapkan secara aktif secara berkala. Keberlanjutan diperoleh dengan menanamkan perubahan ke dalam mekanisme yang tetap berjalan meskipun personel berganti.",
x:["Sosialisasi ulang memperbaiki pemahaman sesaat dan akan terulang pada pergantian berikutnya.",
"Kunci. Prosedur + ukuran kinerja + pemeriksaan berkala yang melembagakan perubahan.",
"Pendampingan membantu transisi, tetapi tetap bergantung pada ketersediaan orang.",
"Menerima pelemahan berarti membatalkan hasil perubahan yang sudah dicapai."]},

{c:7,q:"Kebijakan baru dari pusat mengubah alur pemeriksaan kualitas data secara mendasar dan harus berlaku bulan depan. Sebagian besar unit belum memahami implikasinya. Tindakan level 4 adalah…",
o:["Meneruskan kebijakan tersebut kepada seluruh unit disertai salinan aturannya",
"Menerjemahkan kebijakan menjadi cara kerja konkret bagi setiap unit, mengidentifikasi risiko penerapan pada masa transisi, menyiapkan mitigasinya, dan memantau penerapan pada bulan-bulan pertama",
"Meminta setiap unit menyusun sendiri penyesuaian yang diperlukan sesuai kondisinya",
"Mengusulkan kepada pusat agar pemberlakuan kebijakan diundur"],
a:1,k:"Memimpin perubahan berarti menerjemahkan kebijakan, memitigasi risiko, dan memantau penerapan.",
w:"Indikator 4.1 dan 4.2 menuntut penyiapan unit disertai mitigasi risiko dan pemastian penerapan secara berkala. Meneruskan aturan tanpa penerjemahan bukan memimpin perubahan.",
x:["Meneruskan salinan aturan adalah tindakan administratif, bukan kepemimpinan perubahan.",
"Kunci. Penerjemahan ke cara kerja + mitigasi risiko transisi + pemantauan penerapan.",
"Menyerahkan penyesuaian ke tiap unit menghasilkan tafsir beragam dan penerapan tidak selaras.",
"Mengusulkan penundaan menghindari tantangan penerapan pada lingkup kewenangan sendiri."]},

{c:7,q:"Anda ingin memastikan program perubahan di instansi tidak berhenti sebagai kegiatan tahunan. Langkah level 4 yang paling tepat adalah…",
o:["Menambah jumlah program perubahan setiap tahun agar semangat pembaruan terjaga",
"Menetapkan mekanisme pemantauan penerapan perubahan sebagai bagian tetap dari siklus manajemen kinerja instansi, dengan tinjauan berkala dan penyelarasan antar unit",
"Membentuk tim khusus perubahan yang bekerja terpisah dari struktur yang ada",
"Melaporkan capaian program perubahan kepada pimpinan setiap akhir tahun"],
a:1,k:"Perubahan melekat pada siklus manajemen kinerja, ditinjau berkala, diselaraskan antar unit.",
w:"Indikator 4.2 dan 4.3 menuntut pemastian penerapan secara berkala dan keselarasan antar unit. Menanamkan pemantauan ke dalam siklus manajemen kinerja membuat perubahan menjadi cara kerja, bukan proyek.",
x:["Menambah jumlah program memperbesar beban tanpa memastikan penerapan.",
"Kunci. Pemantauan sebagai bagian siklus manajemen kinerja + tinjauan berkala + penyelarasan.",
"Tim terpisah cenderung menjadikan perubahan urusan segelintir orang, bukan seluruh unit.",
"Laporan akhir tahun mencatat hasil tanpa memastikan penerapan sepanjang tahun."]},

{c:7,q:"Sebuah inovasi yang Anda dorong ternyata menimbulkan beban tambahan yang tidak diperkirakan pada dua unit. Tindakan level 4 adalah…",
o:["Melanjutkan inovasi karena manfaat jangka panjangnya lebih besar daripada beban sesaat",
"Menghentikan inovasi tersebut untuk menghindari penolakan yang lebih luas",
"Meninjau penerapan bersama kedua unit, menyesuaikan rancangan atau tahapan untuk menghilangkan beban yang tidak perlu, lalu memastikan penerapan lanjutan tetap selaras di seluruh unit",
"Memberikan tambahan sumber daya kepada dua unit tersebut agar bebannya tertanggung"],
a:2,k:"Memimpin perubahan berarti meninjau dan menyesuaikan, bukan memaksakan atau membatalkan.",
w:"Indikator 4.2 menuntut pemastian penerapan yang aktif dan berkala; peninjauan adalah bagian darinya. Menyesuaikan rancangan berdasarkan pengalaman penerapan menjaga inovasi tetap hidup dan diterima.",
x:["Melanjutkan tanpa penyesuaian mengabaikan umpan balik penerapan dan memupuk penolakan.",
"Penghentian membuang manfaat inovasi karena persoalan yang sebenarnya dapat diperbaiki.",
"Kunci. Peninjauan bersama + penyesuaian rancangan + penjagaan keselarasan penerapan.",
"Penambahan sumber daya menutupi rancangan yang belum efisien."]},

{c:7,q:"Instansi Anda akan menerapkan kecerdasan buatan untuk membantu pemeriksaan kualitas data. Sebagian pegawai khawatir perannya tergantikan. Tindakan level 4 adalah…",
o:["Menegaskan bahwa teknologi tidak akan menggantikan pegawai dan meminta mereka tidak khawatir",
"Mengarahkan unit menyiapkan perubahan peran secara terencana — pekerjaan yang dialihkan ke mesin, peran baru pegawai, kompetensi yang perlu disiapkan — disertai mitigasi risiko dan pemantauan penerapan",
"Menerapkan teknologi pada satu unit percontohan dan menilai hasilnya sebelum diperluas",
"Menyelenggarakan sosialisasi mengenai manfaat kecerdasan buatan bagi pekerjaan pegawai"],
a:1,k:"Kesiapan menghadapi perubahan mencakup perubahan peran manusia, bukan hanya teknologinya.",
w:"Indikator 4.1 menuntut mengarahkan unit kerja agar lebih siap menghadapi perubahan termasuk memitigasi risiko. Risiko terbesar pada penerapan teknologi adalah ketidakjelasan peran, sehingga penyiapan peran baru merupakan mitigasi utama.",
x:["Penegasan tanpa rencana peran tidak menghilangkan kekhawatiran yang berdasar.",
"Kunci. Pemetaan pekerjaan + peran baru + kompetensi + mitigasi + pemantauan penerapan.",
"Percontohan adalah metode penerapan yang baik, tetapi belum menjawab persoalan peran pegawai.",
"Sosialisasi manfaat bersifat komunikatif dan tidak menyiapkan unit menghadapi perubahan peran."]},

{c:8,q:"Ditemukan ketidaksesuaian besar antara data lapangan dan data prelist yang berdampak pada kegiatan tiga fungsi sekaligus. Waktu tersisa dua minggu sebelum tenggat pengolahan. Tindakan Pengambilan Keputusan level 4 adalah…",
o:["Meminta setiap fungsi menyelesaikan ketidaksesuaian pada bagiannya masing-masing",
"Menyusun dan memutuskan konsep penyelesaian menyeluruh yang melibatkan seluruh fungsi terkait, menetapkan urutan penanganan, dan mengantisipasi dampak keputusan pada tenggat masing-masing fungsi",
"Memprioritaskan penyelesaian pada fungsi dengan tenggat paling dekat",
"Menunda pengolahan sampai seluruh ketidaksesuaian tuntas diperbaiki"],
a:1,k:"Menyusun konsep penyelesaian yang melibatkan beberapa atau seluruh fungsi organisasi.",
w:"Indikator 4.1 berbunyi menyusun dan/atau memutuskan konsep penyelesaian masalah yang melibatkan beberapa atau seluruh fungsi dalam organisasi, sedangkan 4.3 menuntut antisipasi dampak keputusan. Keduanya terpenuhi pada pilihan ini.",
x:["Penyelesaian terpisah per fungsi mengabaikan keterkaitan masalah dan berisiko tidak konsisten.",
"Kunci. Konsep menyeluruh lintas fungsi + urutan penanganan + antisipasi dampak.",
"Prioritas berdasar tenggat menyelesaikan sebagian dan menunda persoalan pada fungsi lain.",
"Penundaan menyeluruh memindahkan risiko ke tahap berikutnya tanpa menyelesaikan sebab."]},

{c:8,q:"Anda harus memutuskan apakah melanjutkan pengembangan aplikasi internal atau berpindah ke aplikasi yang disediakan pusat. Keduanya memiliki keunggulan dan kelemahan yang berdampak pada banyak unit. Pendekatan level 4 adalah…",
o:["Memilih aplikasi pusat karena lebih terjamin dukungan dan keberlanjutannya",
"Memilih aplikasi internal karena lebih sesuai dengan kebutuhan daerah",
"Menyusun kajian yang membandingkan kedua pilihan dari sisi kebutuhan seluruh unit, biaya, risiko, dan keberlanjutan, memutuskan berdasarkan kajian tersebut, serta menyiapkan langkah mitigasi atas kelemahan pilihan yang diambil",
"Menyerahkan keputusan kepada pimpinan karena dampaknya luas"],
a:2,k:"Keputusan atas masalah kompleks lintas unit disertai mitigasi atas kelemahan pilihan.",
w:"Indikator 4.2 dan 4.3 menuntut solusi atas masalah kompleks yang berdampak pada pihak lain serta antisipasi dampak melalui mitigasi risiko. Setiap pilihan memiliki kelemahan; level 4 memutuskan sekaligus menyiapkan penanganannya.",
x:["Memilih tanpa kajian mengabaikan kebutuhan unit yang beragam.",
"Argumentasi kesesuaian saja tidak menimbang biaya, risiko, dan keberlanjutan.",
"Kunci. Kajian pembanding lintas dimensi + keputusan + mitigasi kelemahan.",
"Melempar keputusan ke atas menghindari tanggung jawab pada lingkup kewenangan sendiri."]},

{c:8,q:"Terjadi kebocoran tampilan data individu pada sebuah dasbor internal yang dapat diakses lintas unit. Anda harus memutuskan langkah dalam waktu singkat. Tindakan level 4 adalah…",
o:["Menutup akses dasbor sampai penyebabnya ditemukan",
"Menutup akses, menelusuri cakupan dan dampak paparan, memberitahukan pihak yang perlu mengetahui, memperbaiki penyebabnya, lalu menetapkan pengendalian akses yang berlaku bagi seluruh dasbor instansi",
"Menghapus data individu dari dasbor dan melanjutkan operasional seperti biasa",
"Meminta seluruh unit tidak membagikan tangkapan layar dasbor kepada pihak luar"],
a:1,k:"Keputusan cepat disertai penelusuran dampak, pemberitahuan, perbaikan, dan pengendalian menyeluruh.",
w:"Indikator 4.3 menuntut membuat keputusan dan mengantisipasi dampak tindak penanganannya. Penanganan insiden yang utuh mencakup penghentian, penilaian dampak, komunikasi, perbaikan akar masalah, dan pengendalian agar tidak terulang.",
x:["Menutup akses adalah langkah pertama yang benar tetapi belum menangani dampak dan pencegahan.",
"Kunci. Penghentian + penilaian dampak + pemberitahuan + perbaikan + pengendalian se-instansi.",
"Menghapus data tanpa menelusuri paparan mengabaikan dampak yang mungkin sudah terjadi.",
"Imbauan tidak mengendalikan risiko dan menempatkan tanggung jawab pada pengguna."]},

{c:8,q:"Anda dihadapkan pada dua alternatif penyelesaian anomali data: pemeriksaan menyeluruh yang akurat namun melewati tenggat, atau pemeriksaan bertarget yang cepat namun berisiko menyisakan kesalahan. Pendekatan level 4 adalah…",
o:["Memilih pemeriksaan menyeluruh karena akurasi adalah hal utama dalam statistik",
"Memilih pemeriksaan bertarget karena tenggat merupakan komitmen yang harus dipenuhi",
"Memutuskan pemeriksaan bertarget berbasis analisis risiko kesalahan, menetapkan ambang mutu yang harus dicapai, menyiapkan pemeriksaan lanjutan pascatenggat, dan menjelaskan keterbatasannya kepada pengguna data",
"Meminta perpanjangan tenggat agar kedua tujuan dapat dicapai sekaligus"],
a:2,k:"Menyeimbangkan risiko dan keberhasilan pelaksanaan, disertai mitigasi dan transparansi.",
w:"Level 4 menuntut keputusan atas masalah kompleks disertai antisipasi dampak dan mitigasi risiko. Memilih jalur cepat menjadi tepat ketika berbasis analisis risiko, punya ambang mutu, rencana lanjutan, dan disampaikan terbuka.",
x:["Mengorbankan tenggat sepenuhnya mengabaikan dampak pada pengguna dan kegiatan lanjutan.",
"Memilih cepat tanpa analisis risiko dan mitigasi adalah keputusan yang tidak terkendali.",
"Kunci. Analisis risiko + ambang mutu + pemeriksaan lanjutan + transparansi keterbatasan.",
"Perpanjangan tenggat bukan keputusan, melainkan penghindaran atas pilihan yang harus diambil."]},

{c:8,q:"Sebuah keputusan yang harus Anda ambil akan menguntungkan kinerja unit Anda namun menambah beban dua unit lain. Pendekatan level 4 adalah…",
o:["Mengambil keputusan tersebut karena berada dalam kewenangan Anda dan menguntungkan capaian unit",
"Membatalkan rencana tersebut agar tidak menimbulkan keberatan dari unit lain",
"Menelaah dampak keputusan pada seluruh unit terkait, membahas bersama untuk mencari rancangan yang manfaat bersihnya terbesar bagi organisasi, lalu memutuskan disertai langkah penanganan beban yang timbul",
"Mengambil keputusan tersebut dan menyerahkan penanganan beban kepada masing-masing unit"],
a:2,k:"Keputusan atas masalah yang berdampak pada pihak lain menimbang manfaat bagi organisasi.",
w:"Indikator 4.2 menyebut menghasilkan solusi dari masalah kompleks yang berdampak pada pihak lain, dan 4.3 menuntut antisipasi dampak penanganannya. Ukuran keputusan pada level 4 adalah manfaat bagi organisasi, bukan bagi unit sendiri.",
x:["Kewenangan formal tidak menjadikan keputusan tepat bila dampak lintas unit diabaikan.",
"Membatalkan karena takut keberatan menghilangkan manfaat yang mungkin besar bagi organisasi.",
"Kunci. Telaah dampak lintas unit + rancangan bermanfaat terbesar + penanganan beban.",
"Melempar beban ke unit lain adalah keputusan yang tidak mengantisipasi dampaknya."]},

{c:8,q:"Anda menerima laporan bahwa satu metode pengumpulan data yang sedang berjalan berpotensi menghasilkan bias besar. Bukti awal belum kuat, sementara kegiatan sudah berjalan 40 persen. Tindakan level 4 adalah…",
o:["Menghentikan kegiatan sampai potensi bias dapat dipastikan",
"Melanjutkan kegiatan karena bukti belum kuat dan penghentian akan merugikan capaian",
"Melanjutkan kegiatan sambil melakukan uji cepat pada sampel untuk memastikan besar bias, menyiapkan dua rencana tindak sesuai hasil uji, dan menetapkan titik keputusan yang jelas",
"Meminta pendapat BPS RI dan menunggu arahan sebelum mengambil sikap"],
a:2,k:"Keputusan dalam ketidakpastian: uji cepat, rencana bercabang, titik keputusan yang jelas.",
w:"Level 4 menuntut keputusan atas masalah kompleks disertai mitigasi risiko. Ketika bukti belum memadai, keputusan yang tepat adalah merancang cara memperoleh bukti tanpa menghentikan seluruh kegiatan, dengan rencana tindak yang sudah disiapkan.",
x:["Penghentian menyeluruh atas dasar bukti lemah menimbulkan kerugian besar yang belum tentu perlu.",
"Melanjutkan tanpa pengujian membiarkan risiko besar berjalan tanpa kendali.",
"Kunci. Uji cepat + dua rencana tindak + titik keputusan yang ditetapkan lebih dahulu.",
"Menunggu arahan menunda penanganan pada masalah yang berada dalam kendali Anda."]},

{c:8,q:"Sebuah keputusan pengadaan perangkat yang Anda ambil tahun lalu kini terbukti kurang tepat karena kebutuhan berubah. Perangkat masih memiliki masa manfaat panjang. Tindakan level 4 adalah…",
o:["Mempertahankan penggunaan perangkat tersebut agar tidak dianggap pemborosan",
"Mengakui perubahan kebutuhan, menyusun konsep pemanfaatan ulang perangkat untuk fungsi lain yang membutuhkan, dan memperbaiki cara penilaian kebutuhan pada pengadaan berikutnya",
"Mengusulkan penghapusan perangkat dan pengadaan baru sesuai kebutuhan sekarang",
"Menyimpan perangkat sampai kebutuhan serupa muncul kembali di kemudian hari"],
a:1,k:"Keputusan lanjutan yang memaksimalkan manfaat sekaligus memperbaiki proses pengambilan keputusan.",
w:"Indikator 4.2 dan 4.3 menuntut solusi atas masalah yang berdampak pada pihak lain disertai antisipasi dampak. Pemanfaatan ulang menyelamatkan nilai aset, sedangkan perbaikan cara penilaian kebutuhan mencegah kekeliruan berulang.",
x:["Mempertahankan penggunaan yang tidak sesuai kebutuhan justru menambah kerugian.",
"Kunci. Pemanfaatan ulang lintas fungsi + perbaikan proses penilaian kebutuhan.",
"Penghapusan dan pengadaan baru adalah pilihan mahal yang belum mempertimbangkan alternatif.",
"Menyimpan tanpa pemanfaatan membiarkan nilai aset menyusut tanpa manfaat."]},

{c:8,q:"Dua koordinator mengusulkan solusi berbeda untuk masalah keterlambatan pengolahan, keduanya masuk akal dan didukung data yang berbeda. Anda harus memutuskan. Pendekatan level 4 adalah…",
o:["Memilih usulan koordinator yang lebih berpengalaman di bidang tersebut",
"Menggabungkan sebagian dari kedua usulan agar keduanya merasa dihargai",
"Menguji kedua usulan terhadap kriteria yang disepakati lebih dahulu — dampak pada seluruh fungsi, risiko, biaya, dan keberlanjutan — lalu memutuskan berdasarkan hasil pengujian dan menjelaskan dasar keputusannya",
"Meminta kedua koordinator mencapai kesepakatan sendiri sebelum keputusan diambil"],
a:2,k:"Keputusan berbasis kriteria yang ditetapkan lebih dahulu, dijelaskan secara terbuka.",
w:"Level 4 menuntut keputusan atas masalah yang melibatkan beberapa fungsi. Menetapkan kriteria sebelum menilai usulan mencegah keputusan dipengaruhi kedekatan atau senioritas, dan penjelasan terbuka menjaga penerimaan.",
x:["Senioritas bukan kriteria mutu solusi.",
"Penggabungan demi kenyamanan berisiko menghasilkan solusi yang tidak koheren.",
"Kunci. Kriteria disepakati lebih dahulu + pengujian + keputusan yang dijelaskan.",
"Menyerahkan kesepakatan kepada pengusul menunda keputusan yang menjadi tanggung jawab Anda."]},

{c:8,q:"Anda harus memutuskan pengalihan sebagian anggaran kegiatan untuk menutup kebutuhan mendesak pemeliharaan sistem yang menopang seluruh kegiatan instansi. Tindakan level 4 adalah…",
o:["Menunda pemeliharaan sampai tersedia anggaran khusus pada tahun berikutnya",
"Mengalihkan anggaran dari kegiatan dengan risiko dampak terkecil setelah menelaah konsekuensinya pada seluruh fungsi, memutuskan disertai rencana pemulihan kegiatan yang dikurangi, dan menjelaskannya kepada unit terdampak",
"Mengalihkan anggaran secara merata dari seluruh kegiatan agar dampaknya kecil bagi setiap unit",
"Meminta setiap unit menyisihkan anggarannya secara sukarela"],
a:1,k:"Keputusan lintas fungsi berbasis telaah dampak, disertai rencana pemulihan dan komunikasi.",
w:"Indikator 4.1 dan 4.3 menuntut penyelesaian masalah yang melibatkan beberapa fungsi disertai antisipasi dampak penanganannya. Memilih sumber pengalihan berdasarkan risiko dampak adalah inti keputusan yang seksama.",
x:["Menunda pemeliharaan sistem penopang berisiko menimbulkan gangguan yang jauh lebih mahal.",
"Kunci. Telaah dampak lintas fungsi + pemilihan berbasis risiko + rencana pemulihan + komunikasi.",
"Pemerataan tampak adil tetapi mengabaikan perbedaan tingkat kepentingan kegiatan.",
"Kesukarelaan tidak menghasilkan keputusan dan berpotensi tidak mencukupi kebutuhan."]},

{c:8,q:"Sebuah masalah berulang setiap periode kegiatan meskipun selalu diselesaikan dengan cepat. Tindakan level 4 adalah…",
o:["Menyusun prosedur penanganan cepat agar penyelesaiannya makin efisien setiap periode",
"Menelusuri sebab mendasar yang melintasi beberapa fungsi, menyusun konsep penyelesaian menyeluruh yang mengubah proses di hulu, dan mengantisipasi dampak perubahan tersebut pada fungsi terkait",
"Menugaskan satu orang khusus menangani masalah tersebut setiap periode",
"Mencatat masalah tersebut sebagai risiko yang diterima organisasi"],
a:1,k:"Masalah berulang diselesaikan di hulu, lintas fungsi, dengan antisipasi dampak.",
w:"Indikator 4.1 dan 4.2 menuntut penyelesaian masalah kompleks yang melibatkan beberapa fungsi. Masalah yang berulang menandakan sebabnya berada di hulu proses dan melampaui satu unit.",
x:["Prosedur penanganan cepat mengefisienkan pemadaman, bukan menghilangkan sumber api.",
"Kunci. Penelusuran sebab mendasar lintas fungsi + perubahan proses hulu + antisipasi dampak.",
"Menugaskan orang khusus melembagakan masalah, bukan menyelesaikannya.",
"Menerima sebagai risiko tanpa upaya perbaikan tidak sesuai tuntutan level 4."]},

{c:8,q:"Anda harus memutuskan penerapan aturan validasi baru yang akan menaikkan mutu data namun menambah waktu pengisian di lapangan pada masa puncak kegiatan. Pendekatan level 4 adalah…",
o:["Menerapkan aturan validasi setelah masa puncak kegiatan berakhir",
"Menerapkan seluruh aturan validasi segera karena mutu data tidak dapat dikompromikan",
"Menerapkan aturan validasi secara berjenjang — aturan berdampak besar diberlakukan segera, sisanya menyusul — setelah menelaah dampak pada beban lapangan, disertai pemantauan dan penyesuaian bila beban melampaui perkiraan",
"Menyerahkan pilihan penerapan kepada masing-masing kabupaten sesuai kondisinya"],
a:2,k:"Keputusan berjenjang berbasis telaah dampak, dengan pemantauan dan ruang penyesuaian.",
w:"Level 4 menuntut keputusan yang menyeimbangkan risiko dan keberhasilan pelaksanaan serta mengantisipasi dampaknya. Penerapan berjenjang memperoleh sebagian besar manfaat mutu tanpa melumpuhkan kegiatan lapangan.",
x:["Menunda seluruh aturan mengorbankan mutu data pada periode yang justru paling besar volumenya.",
"Penerapan penuh tanpa telaah dampak berisiko menggagalkan capaian lapangan.",
"Kunci. Penjenjangan berbasis dampak + pemantauan + penyesuaian.",
"Penyerahan pilihan ke daerah menghasilkan mutu data yang tidak seragam."]}
];

// Bagian 5 — Perekat Bangsa (9)
const A5 = [
{c:9,q:"Pendataan di sebuah wilayah adat menghadapi penolakan karena masyarakat menganggap pencatatan harta benda bertentangan dengan kebiasaan setempat. Tindakan Perekat Bangsa level 4 adalah…",
o:["Mengganti petugas dengan orang yang berasal dari wilayah tersebut agar lebih diterima",
"Menyusun program pendekatan yang mengakomodasi kebiasaan setempat — pelibatan tokoh adat, penyesuaian waktu dan tata cara kunjungan, penjelasan dalam bahasa dan kerangka nilai mereka — dan memberlakukannya bagi seluruh wilayah dengan karakteristik serupa",
"Menjelaskan dasar hukum kewajiban memberikan keterangan kepada masyarakat setempat",

{c:9,q:"Komposisi pegawai di unit Anda beragam dari sisi suku, agama, dan asal daerah. Selama ini keberagaman itu diperlakukan sebagai hal yang tidak perlu dibicarakan. Tindakan level 4 adalah…",
o:["Mempertahankan sikap tersebut agar tidak muncul sensitivitas yang tidak perlu",

a:1,k:"Mendayagunakan perbedaan latar belakang untuk kelancaran pencapaian tujuan organisasi.",
w:"Indikator 4.2 berbunyi mendayagunakan perbedaan latar belakang untuk mencapai kelancaran pencapaian tujuan organisasi. Level 4 memandang keberagaman sebagai sumber daya, bukan sekadar hal yang harus ditoleransi.",

{c:9,q:"Petugas perempuan mengalami hambatan pada pendataan malam hari di wilayah tertentu, sementara petugas laki-laki sulit mewawancarai responden perempuan di wilayah yang sama. Tindakan level 4 adalah…",

"Pengaturan setempat menghasilkan praktik yang beragam dan tidak terjamin keamanannya."]},

{c:9,q:"Menjelang pemilihan kepala daerah, sebagian pegawai mulai terbuka menunjukkan dukungan politiknya di lingkungan kerja, dan mulai muncul jarak antar kelompok pegawai. Tindakan level 4 adalah…",

w:"Indikator 4.1 menuntut menginisiasi dan merepresentasikan pemerintah di lingkungan kerja untuk senantiasa menjaga persatuan dalam keberagaman. Koridor netralitas dan forum kerja lintas kelompok menjaga persatuan tanpa menegasikan hak pribadi.",

{c:9,q:"Instansi Anda akan menyusun program peningkatan literasi statistik bagi masyarakat. Kondisi sosial ekonomi, tingkat pendidikan, dan akses teknologi calon peserta sangat beragam. Tindakan level 4 adalah…",

const NAMA_K = ["","Integritas","Kerja Sama","Komunikasi","Orientasi pada Hasil","Pelayanan Publik","Pengembangan Diri dan Orang Lain","Mengelola Perubahan","Pengambilan Keputusan","Perekat Bangsa"];
const NAMA_T = {series:"Deret gambar",odd:"Mencari yang berbeda",analogy:"Analogi gambar",matrix:"Matriks 3×3"};
const HURUF = ["A","B","C","D","E"];
const BANK_A = [].concat(A1,A2,A3,A4,A5);

/* ================= penggambar SVG ================= */
let uid = 0;
function jalur(s,n,r,R,cx,cy){
  s = s||'p'; r = r||0;
  if(s==='c') return "M"+(cx-R)+","+cy+" a"+R+","+R+" 0 1,0 "+(2*R)+",0 a"+R+","+R+" 0 1,0 "+(-2*R)+",0 Z";
  let pts=[], m, ang, rad;
  if(s==='star'){
    m = n*2;
    for(let i=0;i<m;i++){
      ang = -90 + r + i*360/m; rad = (i%2===0) ? R : R*0.45;
      pts.push([cx+rad*Math.cos(ang*Math.PI/180), cy+rad*Math.sin(ang*Math.PI/180)]);
    }
  } else {
    for(let i=0;i<n;i++){
      ang = -90 + r + i*360/n;
      pts.push([cx+R*Math.cos(ang*Math.PI/180), cy+R*Math.sin(ang*Math.PI/180)]);
    }
  }
  return "M"+pts.map(p=>p[0].toFixed(2)+","+p[1].toFixed(2)).join(" L")+" Z";
}
function bagian(f,R,cx,cy,isi){
  // f: 0 kosong, 1 penuh, 2 separuh kiri
  const id = "k"+(++uid);
  let out = '<clipPath id="'+id+'"><path d="'+isi+'"/></clipPath>';
  if(f===1) out += '<path d="'+isi+'" class="isian"/>';
  if(f===2) out += '<rect x="'+(cx-R-2)+'" y="'+(cy-R-2)+'" width="'+(R+2)+'" height="'+(2*R+4)+'" class="isian" clip-path="url(#'+id+')"/>';
  return {def:out,clip:id};
}
function gambar(f,R,cx,cy){
  if(!f) return "";
  R = R||34; cx = cx===undefined?50:cx; cy = cy===undefined?50:cy;
  const d = jalur(f.s,f.n,f.r,R,cx,cy);
  const b = bagian(f.f||0,R,cx,cy,d);
  let g = "<defs>"+b.def.replace(/<path d="[^"]*" class="isian"\/>/,'')+"</defs>";
  // isian digambar setelah defs
  let isi = "";
  if((f.f||0)===1) isi = '<path d="'+d+'" class="isian" opacity=".85"/>';
  if((f.f||0)===2) isi = '<rect x="'+(cx-R-2)+'" y="'+(cy-R-2)+'" width="'+(R+2)+'" height="'+(2*R+4)+'" class="isian" opacity=".85" clip-path="url(#'+b.clip+')"/>';
  let out = g + isi + '<path d="'+d+'" class="goresan"/>';
  // garis mendatar di dalam
  if(f.l){
    const n=f.l, atas=cy-R*0.72, bawah=cy+R*0.72, jarak=(bawah-atas)/(n+1);
    for(let i=1;i<=n;i++){
      const y=atas+jarak*i;
      out += '<line x1="'+(cx-R)+'" y1="'+y.toFixed(1)+'" x2="'+(cx+R)+'" y2="'+y.toFixed(1)+'" class="goresan" stroke-width="2" clip-path="url(#'+b.clip+')"/>';
    }
  }
  // titik-titik
  if(f.d){
    const n=f.d, rr=(n===1)?0:R*0.48, jr=n>8?2.1:2.9;
    for(let i=0;i<n;i++){
      const a=(-90+i*360/n)*Math.PI/180;
      out += '<circle cx="'+(cx+rr*Math.cos(a)).toFixed(2)+'" cy="'+(cy+rr*Math.sin(a)).toFixed(2)+'" r="'+jr+'" class="titik"/>';
    }
  }
  // panah (0 = ke atas, searah jarum jam)
  if(f.ar!==undefined){
    const a=(f.ar-90)*Math.PI/180, pj=R*0.78;
    const x2=cx+pj*Math.cos(a), y2=cy+pj*Math.sin(a);
    const s1=(f.ar-90+150)*Math.PI/180, s2=(f.ar-90-150)*Math.PI/180, ks=9;
    out += '<line x1="'+cx+'" y1="'+cy+'" x2="'+x2.toFixed(2)+'" y2="'+y2.toFixed(2)+'" class="goresan"/>'
        +  '<path d="M'+x2.toFixed(2)+','+y2.toFixed(2)+' L'+(x2+ks*Math.cos(s1)).toFixed(2)+','+(y2+ks*Math.sin(s1)).toFixed(2)
        +  ' L'+(x2+ks*Math.cos(s2)).toFixed(2)+','+(y2+ks*Math.sin(s2)).toFixed(2)+' Z" fill="var(--tinta)"/>';
  }
  // bentuk di dalam
  if(f.i) out += gambar(f.i,R*0.46,cx,cy);
  return out;
}
function svg(f){ return '<svg viewBox="0 0 100 100" aria-hidden="true">'+gambar(f)+'</svg>'; }

/* ================= keadaan ================= */
const keadaan = {
  A:{urut:[],saring:new Set(),ke:0,jawab:{}},
  B:{urut:[],saring:new Set(),ke:0,jawab:{}},
  bank:"A"
};
const bankData = b => b==="A" ? BANK_A : BANK_B;
function kunciSaring(b,i){ return b==="A" ? bankData(b)[i].c : bankData(b)[i].t; }

function susun(b,acak){
  const st=keadaan[b], semua=bankData(b).map((_,i)=>i);
  st.urut = st.saring.size ? semua.filter(i=>st.saring.has(kunciSaring(b,i))) : semua;
  if(acak) for(let i=st.urut.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[st.urut[i],st.urut[j]]=[st.urut[j],st.urut[i]];}
  st.ke = 0;
}

/* ================= tampilan ================= */
const el = id => document.getElementById(id);

function chipsGambar(){
  const b=keadaan.bank, st=keadaan[b];
  const daftar = b==="A" ? [1,2,3,4,5,6,7,8,9].map(i=>[i,NAMA_K[i]]) : Object.keys(NAMA_T).map(t=>[t,NAMA_T[t]]);
  el("chips").innerHTML = daftar.map(([k,n])=>{
    const jml = bankData(b).filter((_,i)=>kunciSaring(b,i)===k).length;
    return '<button class="chip" data-k="'+k+'" aria-pressed="'+st.saring.has(k)+'">'+n+' <span style="opacity:.6">'+jml+'</span></button>';
  }).join("");
  el("chips").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
    let k=c.dataset.k; if(b==="A") k=+k;
    st.saring.has(k) ? st.saring.delete(k) : st.saring.add(k);
    susun(b,false); chipsGambar(); render();
  });
}

function baris(figs){ return '<div class="figbaris">'+figs.map(f=>'<div class="fig">'+svg(f)+'</div>').join("")+'<div class="tanya">?</div></div>'; }

function badanSoal(b,idx,dijawab){
  const s=bankData(b)[idx];
  let atas="", opsi="";
  if(b==="A"){
    atas = '<p class="stem">'+s.q+'</p>';
    opsi = '<div class="opsi">'+s.o.map((t,i)=>{
      let kls="op"; if(dijawab!==undefined){ if(i===s.a) kls+=" benar"; else if(i===dijawab) kls+=" salah"; else kls+=" pudar"; }
      return '<button class="'+kls+'" data-i="'+i+'"'+(dijawab!==undefined?" disabled":"")+'><span class="huruf">'+HURUF[i]+'</span><span>'+t+'</span></button>';
    }).join("")+'</div>';
  } else {
    if(s.t==="series") atas = baris(s.figs) + '<p class="stem">Lanjutkan deret di atas. Gambar mana yang tepat menggantikan tanda tanya?</p>';
    else if(s.t==="odd"){
      atas = '<div class="figbaris">'+s.figs.map((f,i)=>'<div style="text-align:center"><div class="fig">'+svg(f)+'</div><div class="mini">'+HURUF[i]+'</div></div>').join("")+'</div>'
           + '<p class="stem">Empat gambar memiliki satu kesamaan. Gambar mana yang tidak termasuk kelompok itu?</p>';
    }
    else if(s.t==="analogy"){
      atas = '<div class="figbaris"><div class="fig">'+svg(s.p[0])+'</div><span class="sama">:</span><div class="fig">'+svg(s.p[1])+'</div>'
           + '<span class="sama">&nbsp;seperti&nbsp;</span><div class="fig">'+svg(s.p[2])+'</div><span class="sama">:</span><div class="tanya">?</div></div>'
           + '<p class="stem">Temukan hubungan pada pasangan pertama, lalu terapkan pada gambar ketiga.</p>';
    }
    else {
      atas = '<div class="matriks">'+s.cells.map(c=>c?('<div class="sel">'+svg(c)+'</div>'):'<div class="sel kosong">?</div>').join("")+'</div>'
           + '<p class="stem">Temukan aturan yang berlaku pada baris dan kolom, lalu lengkapi sel yang kosong.</p>';
    }
    const daftarOpsi = s.t==="odd" ? s.figs : s.opts;
    opsi = '<div class="opsifig">'+daftarOpsi.map((f,i)=>{
      let kls="opfig"; if(dijawab!==undefined){ if(i===s.a) kls+=" benar"; else if(i===dijawab) kls+=" salah"; }
      return '<button class="'+kls+'" data-i="'+i+'"'+(dijawab!==undefined?" disabled":"")+'><div class="fig" style="width:100%;height:76px">'+svg(f)+'</div><span class="huruf">'+HURUF[i]+'</span></button>';
    }).join("")+'</div>';
  }
  return atas+opsi;
}

function ulasan(b,idx,dijawab){
  const s=bankData(b)[idx], benar = dijawab===s.a;
  const alasan = b==="A" ? s.x : s.why;
  const teks = b==="A" ? s.w : s.rule;
  const daftar = alasan.map((t,i)=>'<li'+(i===s.a?' class="iskunci"':'')+'><b>'+HURUF[i]+'</b><span>'+t+'</span></li>').join("");
  return '<div class="ulasan">'
    + '<p class="vonis '+(benar?"ok":"no")+'">'+(benar?"Tepat.":"Belum tepat.")+' Jawaban benar: '+HURUF[s.a]+'</p>'
    + '<div class="blok"><h4>Mengapa jawaban itu benar</h4><p>'+teks+'</p></div>'
    + '<div class="blok kunci"><h4>Kata kunci</h4><p>'+s.k+'</p></div>'
    + '<div class="blok"><h4>Telaah setiap pilihan</h4><ul class="daftar">'+daftar+'</ul></div>'
    + '</div>';
}

function ringkasan(b){
  const st=keadaan[b], total=st.urut.length;
  let betul=0; const per={};
  st.urut.forEach(i=>{
    const k=kunciSaring(b,i), s=bankData(b)[i];
    per[k]=per[k]||{n:0,b:0};
    if(st.jawab[i]!==undefined){ per[k].n++; if(st.jawab[i]===s.a){betul++;per[k].b++;} }
  });
  const terjawab=Object.keys(st.jawab).filter(i=>st.urut.includes(+i)).length;
  const nama = b==="A" ? (k=>NAMA_K[k]) : (k=>NAMA_T[k]);
  const rows=Object.keys(per).filter(k=>per[k].n>0).map(k=>{
    const p=per[k]; return '<tr><td>'+nama(b==="A"?+k:k)+'</td><td class="angka">'+p.b+' / '+p.n+'</td><td class="angka">'+Math.round(p.b/p.n*100)+'%</td></tr>';
  }).join("");
  return '<div class="ringkas"><h3>Rangkuman sesi</h3>'
    + '<div class="skor">'+betul+' / '+terjawab+'</div>'
    + '<p class="mini">'+terjawab+' soal dikerjakan dari '+total+' soal yang tersedia pada penyaringan ini.</p>'
    + (rows?'<table><thead><tr><th>Kelompok</th><th class="angka">Benar</th><th class="angka">Ketepatan</th></tr></thead><tbody>'+rows+'</tbody></table>':'')
    + '<div class="nav"><button class="tombol utama" id="kembali">Kembali ke soal pertama</button><button class="tombol" id="ulang2">Mulai ulang</button></div></div>';
}

function render(){
  const b=keadaan.bank, st=keadaan[b], total=st.urut.length;
  if(!total){ el("panggung").innerHTML='<div class="kartu"><p class="kosongpesan">Tidak ada soal pada penyaringan ini. Pilih kelompok lain di atas.</p></div>'; el("posisi").textContent=""; el("nilai").textContent=""; el("isibar").style.width="0"; return; }
  if(st.ke>=total){ el("panggung").innerHTML=ringkasan(b); el("kembali").onclick=()=>{st.ke=0;render();}; el("ulang2").onclick=mulaiUlang; el("isibar").style.width="100%"; return; }

  const idx=st.urut[st.ke], s=bankData(b)[idx], dijawab=st.jawab[idx];
  const tag = b==="A" ? NAMA_K[s.c] : NAMA_T[s.t];
  el("panggung").innerHTML = '<div class="kartu">'
    + '<div class="kepala-soal"><span class="nomor">'+String(st.ke+1).padStart(2,"0")+'</span><span class="label">'+tag+'</span></div>'
    + badanSoal(b,idx,dijawab)
    + (dijawab!==undefined ? ulasan(b,idx,dijawab) : "")
    + '<div class="nav">'
      + '<button class="tombol" id="mundur"'+(st.ke===0?" disabled":"")+'>Sebelumnya</button>'
      + (dijawab!==undefined ? '<button class="tombol utama" id="maju">'+(st.ke===total-1?"Lihat rangkuman":"Soal berikutnya")+'</button>' : '<span class="mini">Pilih satu jawaban untuk melihat ulasannya.</span>')
    + '</div></div>';

  el("panggung").querySelectorAll("[data-i]").forEach(tb=>tb.onclick=()=>{ st.jawab[idx]=+tb.dataset.i; render(); });
  const mundur=el("mundur"); if(mundur) mundur.onclick=()=>{ if(st.ke>0){st.ke--;render();} };
  const maju=el("maju"); if(maju) maju.onclick=()=>{ st.ke++; render(); window.scrollTo({top:0,behavior:"smooth"}); };

  const jml=Object.keys(st.jawab).filter(i=>st.urut.includes(+i)).length;
  const betul=Object.keys(st.jawab).filter(i=>st.urut.includes(+i)&&st.jawab[i]===bankData(b)[i].a).length;
  el("posisi").textContent="Soal "+(st.ke+1)+" dari "+total;
  el("nilai").textContent = jml? ("Benar "+betul+" dari "+jml+" · "+Math.round(betul/jml*100)+"%") : "Belum ada jawaban";
  el("isibar").style.width = (st.ke/total*100)+"%";
}

function mulaiUlang(){ const b=keadaan.bank; keadaan[b].jawab={}; susun(b,false); render(); }

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected", x===t ? "true":"false"));
  keadaan.bank=t.dataset.bank; chipsGambar(); render(); window.scrollTo({top:0});
});
el("acak").onclick=()=>{ susun(keadaan.bank,true); keadaan[keadaan.bank].jawab={}; render(); };
el("ulang").onclick=mulaiUlang;

document.addEventListener("keydown",e=>{
  const b=keadaan.bank, st=keadaan[b];
  if(st.ke>=st.urut.length) return;
  const idx=st.urut[st.ke];
  if(e.key==="ArrowRight" && st.jawab[idx]!==undefined){ st.ke++; render(); }
  else if(e.key==="ArrowLeft" && st.ke>0){ st.ke--; render(); }
  else if(st.jawab[idx]===undefined){
    const p="abcde".indexOf(e.key.toLowerCase()), n=parseInt(e.key,10)-1;
    const pilih = p>=0?p:(n>=0?n:-1);
    const tombol=el("panggung").querySelector('[data-i="'+pilih+'"]');
    if(pilih>=0 && tombol){ st.jawab[idx]=pilih; render(); }
  }
});

susun("A",false); susun("B",false); chipsGambar(); render();
</script>
</body>
</html>
